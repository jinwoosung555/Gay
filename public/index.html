<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HWID License Panel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at top left, #7c3aed 0%, transparent 35%),
                radial-gradient(circle at bottom right, #06b6d4 0%, transparent 35%),
                linear-gradient(135deg, #080b18, #111827);
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
            padding: 50px 0;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 42px;
            background: linear-gradient(
                90deg,
                #a855f7,
                #ec4899,
                #06b6d4
            );
            -webkit-background-clip: text;
            color: transparent;
        }

        .header p {
            margin-top: 10px;
            color: #a5b4fc;
        }

        .card {
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.35);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 22px;

            color: white;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            background: linear-gradient(
                135deg,
                #8b5cf6,
                #ec4899
            );

            box-shadow: 0 8px 25px rgba(168,85,247,0.35);

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(236,72,153,0.4);
        }

        #key {
            display: none;

            margin-top: 20px;
            padding: 18px;

            border-radius: 12px;

            background: rgba(16,185,129,0.12);
            border: 1px solid rgba(16,185,129,0.35);

            color: #34d399;
            font-family: monospace;
            font-size: 18px;
            word-break: break-all;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .stat {
            padding: 22px;
            border-radius: 16px;

            background: linear-gradient(
                135deg,
                rgba(139,92,246,0.2),
                rgba(6,182,212,0.08)
            );

            border: 1px solid rgba(255,255,255,0.08);
        }

        .stat h3 {
            color: #c4b5fd;
            font-size: 14px;
        }

        .stat p {
            margin-top: 8px;
            font-size: 28px;
            font-weight: bold;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        th {
            color: #c4b5fd;
        }

        .active {
            color: #34d399;
        }

        .unbound {
            color: #fbbf24;
        }

        @media(max-width: 700px) {

            .header h1 {
                font-size: 32px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>⚡ HWID License Panel</h1>
        <p>Manage and verify your license keys</p>
    </div>

    <div class="stats">

        <div class="stat">
            <h3>Total Licenses</h3>
            <p id="total">0</p>
        </div>

        <div class="stat">
            <h3>HWID Bound</h3>
            <p id="bound">0</p>
        </div>

        <div class="stat">
            <h3>Active</h3>
            <p id="active">0</p>
        </div>

    </div>

    <br>

    <div class="card">

        <h2>🔑 Generate License</h2>

        <button onclick="generateKey()">
            ✨ Generate New Key
        </button>

        <div id="key"></div>

    </div>

    <div class="card">

        <h2>📋 Licenses</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>License</th>
                        <th>HWID</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="licenses">
                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

async function generateKey() {

    const response = await fetch("/api/licenses", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        }
    });

    const data = await response.json();

    if (data.success) {

        const keyBox = document.getElementById("key");

        keyBox.style.display = "block";

        keyBox.textContent =
            "🔑 " + data.key;

        loadLicenses();
    }
}


async function loadLicenses() {

    const response =
        await fetch("/api/licenses");

    const licenses =
        await response.json();

    const table =
        document.getElementById("licenses");

    table.innerHTML = "";

    let bound = 0;
    let active = 0;

    licenses.forEach(license => {

        if (license.hwid)
            bound++;

        if (license.active)
            active++;

        const row =
            document.createElement("tr");

        row.innerHTML = `
            <td>
                ${license.key}
            </td>

            <td>
                ${
                    license.hwid
                    ? license.hwid
                    : '<span class="unbound">Not bound</span>'
                }
            </td>

            <td>
                ${
                    license.active
                    ? '<span class="active">● Active</span>'
                    : 'Disabled'
                }
            </td>
        `;

        table.appendChild(row);
    });

    document.getElementById("total")
        .textContent = licenses.length;

    document.getElementById("bound")
        .textContent = bound;

    document.getElementById("active")
        .textContent = active;
}


loadLicenses();

</script>

</body>
</html>
